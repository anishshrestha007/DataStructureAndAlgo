<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Tic Tac Toe</h1>
        <button id="new-game" class="btn" type="button">New game</button>
      </header>

      <section class="scoreboard" aria-label="Score">
        <div class="score" id="score-x" data-icon="X">
          <span class="score-icon" aria-hidden="true">X</span>
          <span class="score-name" id="name-x"></span>
          <span class="score-value" id="wins-x">0</span>
        </div>
        <div class="score score-draws">
          <span class="score-name">Draws</span>
          <span class="score-value" id="draws">0</span>
        </div>
        <div class="score" id="score-o" data-icon="O">
          <span class="score-icon" aria-hidden="true">O</span>
          <span class="score-name" id="name-o"></span>
          <span class="score-value" id="wins-o">0</span>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="game">
        <div id="container" class="board" role="grid" aria-label="Game board">
          <div class="board-row" role="row">
            <button class="square" type="button" role="gridcell" data-value="1"></button>
            <button class="square" type="button" role="gridcell" data-value="2"></button>
            <button class="square" type="button" role="gridcell" data-value="3"></button>
          </div>
          <div class="board-row" role="row">
            <button class="square" type="button" role="gridcell" data-value="4"></button>
            <button class="square" type="button" role="gridcell" data-value="5"></button>
            <button class="square" type="button" role="gridcell" data-value="6"></button>
          </div>
          <div class="board-row" role="row">
            <button class="square" type="button" role="gridcell" data-value="7"></button>
            <button class="square" type="button" role="gridcell" data-value="8"></button>
            <button class="square" type="button" role="gridcell" data-value="9"></button>
          </div>
        </div>

        <aside class="history" aria-labelledby="history-title">
          <h2 id="history-title">Moves</h2>
          <ol id="history" start="0"></ol>
        </aside>
      </div>

      <p class="hint">Click a square or use the arrow keys and Enter. Jump to any move to try a different line.</p>
    </main>

    <script src="Script.js"></script>
  </body>
</html>
